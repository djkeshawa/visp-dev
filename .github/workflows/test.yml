name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not stop the other legs on the first failure: an OS-specific or
      # version-specific break is exactly what this matrix exists to surface,
      # and cancelling hides whether the failure is universal or local.
      fail-fast: false
      matrix:
        # The engines floor and the current LTS, across the three platforms the
        # compatibility evidence claims. Path handling and line endings are the
        # usual differences, and both are load-bearing for this repository.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
        # Both managers are exercised because the compatibility harness shells
        # out to them, and their offline and lockfile behaviour differs.
        manager: [npm, pnpm]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # This repository declares no dependencies, so there is nothing to install
      # and nothing to cache. Verifying that stays true is itself worthwhile: a
      # dependency appearing here would change what the published artifact
      # carries.
      - name: Verify the dependency surface is still empty
        shell: bash
        run: |
          deps=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          if [ "$deps" != "0" ]; then
            echo "visp-dev declared $deps runtime dependencies; it is meant to have none."
            exit 1
          fi

      # Installed on every leg, not just the pnpm ones. The matrix varies which
      # manager *invokes* the suite, but the compatibility-lab fixtures shell out
      # to pnpm regardless — it is a test dependency, not the thing under test.
      # Gating it on the manager made every npm leg fail for want of a tool that
      # leg was never given.
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Syntax and tests
        run: ${{ matrix.manager }} run check

      # A clean environment is part of the claim: the harness must not depend on
      # ambient npm or pnpm configuration that happens to exist on a maintainer's
      # machine. Running with a scratch HOME is the cheapest way to prove it.
      - name: Tests in a clean user environment
        shell: bash
        env:
          HOME: ${{ runner.temp }}/clean-home
          USERPROFILE: ${{ runner.temp }}/clean-home
        run: |
          mkdir -p "$HOME"
          ${{ matrix.manager }} run check

      - name: Re-verify committed compatibility evidence
        shell: bash
        run: |
          npm run compatibility:phase-2:verify evidence/phase-2-packed-linux-x64-node24.json
          npm run compatibility:phase-3:verify evidence/phase-3-packed-linux-x64-node24.json
          npm run compatibility:phase-4:verify evidence/phase-4-pair-linux-x64-node24.json
          npm run divergence:verify evidence/registry-divergence-linux-x64-node24.json
          npm run golden-path:verify evidence/golden-path-linux-x64-node24.json
          npm run compatibility:phase-6:verify
          npm run conformance:verify
          npm run conformance:fixtures:verify evidence/conformance-fixtures-linux-x64-node24.json
          npm run conformance:fixtures:verify evidence/conformance-fixtures-darwin-arm64-node24.json
          npm run conformance:provenance:verify

      - name: Confirm nothing was published by this run
        shell: bash
        run: |
          # A build must never be able to publish. This is a cheap standing
          # assertion that the freeze recorded in docs/release-process.md still
          # holds in CI.
          if [ "$(node -p "require('./package.json').private === true")" != "true" ]; then
            echo "package.json is no longer marked private; publication is gated."
            exit 1
          fi

  platform-evidence:
    name: D-107 evidence on ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            os: ubuntu-latest
            platform: linux
            architecture: x64
            filename: conformance-fixtures-linux-x64-node24.json
            artifact: conformance-fixtures-ubuntu-latest
          - label: darwin-arm64
            os: macos-15
            platform: darwin
            architecture: arm64
            filename: conformance-fixtures-darwin-arm64-node24.json
            artifact: conformance-fixtures-macos-latest
    steps:
      - name: Check out Visp Dev
        uses: actions/checkout@v4

      - name: Check out exact D-107 Kit
        uses: actions/checkout@v4
        with:
          repository: djkeshawa/visp-kit
          ref: eb70bce84568e9237690be1eea61355bbff23157
          path: engines/visp-kit

      - name: Check out exact D-107 Hyper
        uses: actions/checkout@v4
        with:
          repository: djkeshawa/visp-hyper-agent
          ref: 3538457ae51f79245358321668c1f3566c5eac74
          path: engines/visp-hyper-agent

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm 11.3.0
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Assert exact source and runner identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C engines/visp-kit rev-parse HEAD)" = eb70bce84568e9237690be1eea61355bbff23157
          test "$(git -C engines/visp-kit rev-parse 'HEAD^{tree}')" = c1cef391194a20a57704bfaa6ed36c7f1b163756
          test "$(git -C engines/visp-hyper-agent rev-parse HEAD)" = 3538457ae51f79245358321668c1f3566c5eac74
          test "$(git -C engines/visp-hyper-agent rev-parse 'HEAD^{tree}')" = 55ca7ea10865630119f792eb227c9634e0fee8f9
          test "$(node -p 'process.platform')" = "${{ matrix.platform }}"
          test "$(node -p 'process.arch')" = "${{ matrix.architecture }}"
          test "$(node -p 'process.versions.node.split(`.`)[0]')" = 24

      - name: Build hermetic package inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/visp-store" "$RUNNER_TEMP/visp-cache"
          for repo in visp-kit visp-hyper-agent; do
            work="$RUNNER_TEMP/fetch-$repo"
            mkdir -p "$work"
            cp "engines/$repo/package.json" "engines/$repo/pnpm-lock.yaml" "$work/"
            (cd "$work" && pnpm fetch --store-dir "$RUNNER_TEMP/visp-store")
          done
          find "$RUNNER_TEMP/visp-store" -type l -delete
          build="$RUNNER_TEMP/cache-build"
          mkdir -p "$build"
          echo '{"name":"c","version":"1.0.0","private":true}' > "$build/package.json"
          (cd "$build" && npm install commander@^12.1.0 zod@^3.25.76 --cache "$RUNNER_TEMP/visp-cache" --no-audit --no-fund)

      - name: Produce exact platform report
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-conformance-fixtures.mjs \
            --kit-repository engines/visp-kit \
            --hyper-repository engines/visp-hyper-agent \
            --offline-store "$RUNNER_TEMP/visp-store" \
            --offline-cache "$RUNNER_TEMP/visp-cache" \
            --package-manager pnpm --npm npm \
            --kit-commit eb70bce84568e9237690be1eea61355bbff23157 \
            --kit-tree c1cef391194a20a57704bfaa6ed36c7f1b163756 \
            --hyper-commit 3538457ae51f79245358321668c1f3566c5eac74 \
            --hyper-tree 55ca7ea10865630119f792eb227c9634e0fee8f9 \
            --run-provider github-actions \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "evidence/${{ matrix.filename }}"

      - name: Upload exact Linux member
        if: matrix.platform == 'linux'
        id: linux-upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: evidence/conformance-fixtures-linux-x64-node24.json
          if-no-files-found: error

      - name: Upload exact macOS member
        if: matrix.platform == 'darwin'
        id: macos-upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: evidence/conformance-fixtures-darwin-arm64-node24.json
          if-no-files-found: error

  evidence-currency:
    name: Advisory evidence currency
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out Visp Dev
        uses: actions/checkout@v4

      - name: Check out current Kit
        uses: actions/checkout@v4
        with:
          repository: djkeshawa/visp-kit
          path: engines/visp-kit

      - name: Check out current Hyper
        uses: actions/checkout@v4
        with:
          repository: djkeshawa/visp-hyper-agent
          path: engines/visp-hyper-agent

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Measure drift from the frozen evidence identities
        run: |
          node scripts/run-evidence-currency.mjs \
            --kit-repository engines/visp-kit \
            --hyper-repository engines/visp-hyper-agent
