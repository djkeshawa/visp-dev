name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not stop the other legs on the first failure: an OS-specific or
      # version-specific break is exactly what this matrix exists to surface,
      # and cancelling hides whether the failure is universal or local.
      fail-fast: false
      matrix:
        # The engines floor and the current LTS, across the three platforms the
        # compatibility evidence claims. Path handling and line endings are the
        # usual differences, and both are load-bearing for this repository.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
        # Both managers are exercised because the compatibility harness shells
        # out to them, and their offline and lockfile behaviour differs.
        manager: [npm, pnpm]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # This repository declares no dependencies, so there is nothing to install
      # and nothing to cache. Verifying that stays true is itself worthwhile: a
      # dependency appearing here would change what the published artifact
      # carries.
      - name: Verify the dependency surface is still empty
        shell: bash
        run: |
          deps=$(node -p "Object.keys(require('./package.json').dependencies || {}).length")
          if [ "$deps" != "0" ]; then
            echo "visp-dev declared $deps runtime dependencies; it is meant to have none."
            exit 1
          fi

      # Installed on every leg, not just the pnpm ones. The matrix varies which
      # manager *invokes* the suite, but the compatibility-lab fixtures shell out
      # to pnpm regardless — it is a test dependency, not the thing under test.
      # Gating it on the manager made every npm leg fail for want of a tool that
      # leg was never given.
      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Syntax and tests
        run: ${{ matrix.manager }} run check

      # A clean environment is part of the claim: the harness must not depend on
      # ambient npm or pnpm configuration that happens to exist on a maintainer's
      # machine. Running with a scratch HOME is the cheapest way to prove it.
      - name: Tests in a clean user environment
        shell: bash
        env:
          HOME: ${{ runner.temp }}/clean-home
          USERPROFILE: ${{ runner.temp }}/clean-home
        run: |
          mkdir -p "$HOME"
          ${{ matrix.manager }} run check

      - name: Re-verify committed compatibility evidence
        shell: bash
        run: |
          npm run compatibility:phase-2:verify evidence/phase-2-packed-linux-x64-node24.json
          npm run compatibility:phase-3:verify evidence/phase-3-packed-linux-x64-node24.json
          npm run compatibility:phase-4:verify evidence/phase-4-pair-linux-x64-node24.json
          npm run divergence:verify evidence/registry-divergence-linux-x64-node24.json
          npm run golden-path:verify evidence/golden-path-linux-x64-node24.json
          npm run compatibility:phase-6:verify
          npm run conformance:verify
          npm run conformance:fixtures:verify evidence/conformance-fixtures-linux-x64-node24.json

      # Standing check that the frozen pairs still describe the engine
      # repositories. Exits non-zero only when the gap reaches the wire schema
      # or integration surface, so documentation churn does not fail the build.

      # The operating_system conformance family cannot be closed from a Linux
      # workstation. These legs are the only place macOS and Windows evidence can
      # come from, so the report is produced here rather than asserted locally.
      #
      # This was previously a no-op. It checked for the engine repositories,
      # found them private, and exited zero — and even with them present it
      # would have thrown, because it passed five of the eleven arguments the
      # runner requires. `continue-on-error` hid both problems.
      - name: Check out visp-kit
        if: matrix.manager == 'pnpm' && matrix.node == 24
        uses: actions/checkout@v4
        with:
          repository: djkeshawa/visp-kit
          path: engines/visp-kit

      - name: Check out visp-hyper-agent
        if: matrix.manager == 'pnpm' && matrix.node == 24
        uses: actions/checkout@v4
        with:
          repository: djkeshawa/visp-hyper-agent
          path: engines/visp-hyper-agent

      # The fixtures install from a local store rather than the network, so the
      # evidence describes a hermetic install. Building that store is fiddly in
      # three documented ways; see docs/release-process.md.
      - name: Build the offline store and cache
        if: matrix.manager == 'pnpm' && matrix.node == 24
        shell: bash
        run: |
          set -euo pipefail
          STORE="$RUNNER_TEMP/visp-store"
          CACHE="$RUNNER_TEMP/visp-cache"
          mkdir -p "$STORE" "$CACHE"

          # pnpm fetch purges node_modules, so it runs against throwaway copies
          # of the lockfiles rather than the checkouts themselves.
          for repo in visp-kit visp-hyper-agent; do
            work="$RUNNER_TEMP/fetch-$repo"
            mkdir -p "$work"
            cp "engines/$repo/package.json" "engines/$repo/pnpm-lock.yaml" "$work/"
            (cd "$work" && pnpm fetch --store-dir "$STORE")
          done

          # pnpm leaves a link back to the directory it fetched from, which
          # escapes the store root and the harness refuses it — correctly, since
          # an escaping link means the snapshot is not self-contained.
          find "$STORE" -type l -delete

          # The npm cache needs a real install. A lockfile-only run leaves the
          # tarball install failing ENOTCACHED on the runtime dependencies.
          build="$RUNNER_TEMP/cache-build"
          mkdir -p "$build"
          echo '{"name":"c","version":"1.0.0","private":true}' > "$build/package.json"
          (cd "$build" && npm install commander@^12.1.0 zod@^3.25.76 --cache "$CACHE" --no-audit --no-fund)

      # Standing check that the frozen pair still describes the engine
      # repositories. Non-blocking: it reports a gap, and whether that gap
      # matters is a judgement the report itself explains.
      - name: Measure how far the frozen pair lags the engine repositories
        if: matrix.manager == 'pnpm' && matrix.node == 24
        shell: bash
        continue-on-error: true
        run: |
          node scripts/run-evidence-currency.mjs \
            --kit-repository engines/visp-kit \
            --hyper-repository engines/visp-hyper-agent

      # sbom:check inventories the engine packages, so it can only run once they
      # are checked out. It was previously in the verify step, which runs before
      # them, and failed every Linux leg with ENOENT on ../visp-kit/package.json.
      #
      # Not run on Windows. The fixtures snapshot a commit at its recorded Git
      # modes and verify the modes applied; Windows has no POSIX mode bits, so
      # `snapshotCommit` fails closed. That refusal is the documented finding
      # (docs/platform-support.md), and `operating_system` in src/conformance.mjs
      # already excludes Windows for it. Running the step there anyway turned an
      # accepted limitation into a permanently red build, which trains everyone
      # to ignore the colour — the opposite of what the evidence is for.
      - name: Produce conformance fixture evidence for this platform
        if: matrix.manager == 'pnpm' && matrix.node == 24 && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          platform=$(node -p 'process.platform')
          arch=$(node -p 'process.arch')

          node scripts/run-conformance-fixtures.mjs \
            --kit-repository engines/visp-kit \
            --hyper-repository engines/visp-hyper-agent \
            --offline-store "$RUNNER_TEMP/visp-store" \
            --offline-cache "$RUNNER_TEMP/visp-cache" \
            --package-manager pnpm --npm npm \
            --kit-commit "$(git -C engines/visp-kit rev-parse HEAD)" \
            --kit-tree "$(git -C engines/visp-kit rev-parse 'HEAD^{tree}')" \
            --hyper-commit "$(git -C engines/visp-hyper-agent rev-parse HEAD)" \
            --hyper-tree "$(git -C engines/visp-hyper-agent rev-parse 'HEAD^{tree}')" \
            --output "evidence/conformance-fixtures-$platform-$arch-node24.json"

      - name: Upload platform conformance evidence
        if: matrix.manager == 'pnpm' && matrix.node == 24 && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: conformance-fixtures-${{ matrix.os }}
          path: evidence/conformance-fixtures-*.json
          if-no-files-found: error

      - name: Confirm nothing was published by this run
        shell: bash
        run: |
          # A build must never be able to publish. This is a cheap standing
          # assertion that the freeze recorded in docs/release-process.md still
          # holds in CI.
          if [ "$(node -p "require('./package.json').private === true")" != "true" ]; then
            echo "package.json is no longer marked private; publication is gated."
            exit 1
          fi
